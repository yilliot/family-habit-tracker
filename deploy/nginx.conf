# @SITE@ -> habit-tracker Go service (systemd unit `habit-tracker`, @ADDR@).
# deploy/install.sh fills in the @PLACEHOLDERS@ and installs this as /etc/nginx/sites-available/@SITE@.
# The exact server_name wins over the *.axon.commun.cloud wildcard block, which also handles
# the port 80 -> https redirect.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @SITE@;

    ssl_certificate /etc/nginx/ssl/axon.commun.cloud.pem;
    ssl_certificate_key /etc/nginx/ssl/axon.commun.cloud.key;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://@ADDR@;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
